# Copier vers /etc/ssh/sshd_config.d/hardening.conf puis :
#   sshd -t && systemctl reload ssh
#
# À appliquer APRÈS création de l’utilisateur deploy + clé SSH testée
# (sinon tu te verrouilles hors du VPS).

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers deploy
X11Forwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
MaxAuthTries 3
LoginGraceTime 30
