# Staging léger (KVM 2) — 1 Postgres + 1 API monolith + 2 gateways.
# Plan e-commerce : Option B (monolithe) autorisée en staging, jamais en prod.
#
#   cp .env.staging.example .env.staging
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
#
# Ports Caddy : shop 8082 · CRM/POS 8083 (localhost uniquement).

name: caisse-staging

x-log: &default-log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caisse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-caisse_crm_staging}
    volumes:
      - caisse_crm_pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-caisse} -d ${POSTGRES_DB:-caisse_crm_staging}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    logging: *default-log
    networks:
      - staging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-caisse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-caisse_crm_staging}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      JWT_SECRET_SHOP: ${JWT_SECRET_SHOP:-}
      SHOP_PANIER_SECRET: ${SHOP_PANIER_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SHOP_PUBLIC_URL: ${SHOP_PUBLIC_URL:-https://staging.majorautoparts.shop}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      ORANGE_MONEY_ENABLED: ${ORANGE_MONEY_ENABLED:-0}
      WAVE_ENABLED: ${WAVE_ENABLED:-0}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SHOP_EMAIL_FROM: ${SHOP_EMAIL_FROM:-}
      SHOP_ADMIN_EMAIL: ${SHOP_ADMIN_EMAIL:-}
      STAFF_EMAIL_FROM: ${STAFF_EMAIL_FROM:-}
      STAFF_BRIEFING_ENABLED: ${STAFF_BRIEFING_ENABLED:-false}
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-https://crm-staging.majorautoparts.shop}
      SEED_ON_START: ${SEED_ON_START:-true}
      P2P_EVIDENCE_STORAGE_DIR: /tmp/p2p-evidence
      PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 50s
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-log
    networks:
      - staging

  gateway-crm:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TLS_ENABLED: "0"
    ports:
      - "${STAGING_BIND:-127.0.0.1}:${STAGING_CRM_PORT:-8083}:80"
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    logging: *default-log
    networks:
      - staging

  gateway-shop:
    build:
      context: .
      dockerfile: apps/shop/Dockerfile.prod
      args:
        VITE_API_URL: ""
        SHOP_NGINX_CONF: nginx.staging.conf
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TLS_ENABLED: "0"
    ports:
      - "${STAGING_BIND:-127.0.0.1}:${STAGING_SHOP_PORT:-8082}:80"
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    logging: *default-log
    networks:
      - staging

networks:
  staging:

volumes:
  caisse_crm_pgdata_staging:
