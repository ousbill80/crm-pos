# Passerelle production : SPA + proxy API + WebSocket (§5.2).
# VITE_API_URL="" côté build → le navigateur appelle la même origine.
upstream caisse_api {
  server api:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Taille max alignée sur main.ts (import catalogue / photos).
  client_max_body_size 8m;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # WebSocket Socket.IO (namespace /tresorerie monté sur /socket.io).
  location /socket.io/ {
    proxy_pass http://caisse_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # REST API — préfixes NestJS (pas de /api global).
  location ~ ^/(health|auth|produits|entreprise|achats|crm|audit|fournisseurs|devis|ventes|users|transactions|reporting|stocks|alertes|zones|caisses|entrepots|boutiques|inventaires)(/|$) {
    proxy_pass http://caisse_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
