# Passerelle production : SPA + proxy API + WebSocket (§5.2).
# Derrière Caddy : HTTP interne. Ne pas exposer ce port hors localhost.
upstream caisse_api {
  server api:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 8m;
  client_body_timeout 30s;
  client_header_timeout 15s;

  include /etc/nginx/security-headers-crm.conf;

  if ($deny_ai_bot) {
    return 403;
  }

  location /socket.io/ {
    include /etc/nginx/proxy-params.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_pass http://caisse_api;
  }

  location = /auth/login {
    limit_req zone=auth burst=8 nodelay;
    limit_req_status 429;
    include /etc/nginx/proxy-params.conf;
    proxy_set_header Connection "";
    proxy_pass http://caisse_api;
  }

  location /auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    include /etc/nginx/proxy-params.conf;
    proxy_set_header Connection "";
    proxy_pass http://caisse_api;
  }

  location ~ ^/(health|produits|entreprise|achats|crm|audit|fournisseurs|devis|ventes|users|transactions|reporting|stocks|alertes|zones|caisses|entrepots|boutiques|inventaires|commandes-web|parametres-shop|zones-livraison|factures-client|accounting-ai|shop)(/|$) {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    include /etc/nginx/proxy-params.conf;
    proxy_set_header Connection "";
    proxy_pass http://caisse_api;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
