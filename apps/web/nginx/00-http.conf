# Chargé dans http {} (conf.d). Ne pas mettre de bloc server ici.
server_tokens off;

# Client réel derrière Caddy / Docker (sinon tout le trafic = 172.x).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Plages Cloudflare (si le gateway est exposé sans Caddy, ou CF-Connecting-IP déjà réécrit).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

map $http_user_agent $deny_ai_bot {
  default 0;
  ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|Anthropic-AI|Google-Extended|Google-CloudVertexBot|Bytespider|CCBot|Amazonbot|Applebot-Extended|meta-externalagent|PerplexityBot|YouBot|Diffbot|cohere-ai|AI2Bot|PetalBot) 1;
}

limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=checkout:10m rate=10r/m;
