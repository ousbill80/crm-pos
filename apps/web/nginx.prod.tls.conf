# TLS terminé sur la passerelle (certificats montés dans /etc/nginx/certs).
# Remplace default.conf lorsque TLS_ENABLED=1 (voir Dockerfile.prod entrypoint).

upstream caisse_api {
  server api:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  # Healthcheck Docker sans TLS (le reste redirige vers HTTPS).
  location = /health {
    proxy_pass http://caisse_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 8m;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /socket.io/ {
    proxy_pass http://caisse_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location ~ ^/(health|auth|produits|entreprise|achats|crm|audit|fournisseurs|devis|ventes|users|transactions|reporting|stocks|alertes|zones|caisses|entrepots|boutiques|inventaires)(/|$) {
    proxy_pass http://caisse_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
