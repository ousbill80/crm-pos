name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Les tests d'intégration API démarrent leur propre PostgreSQL éphémère
      # via Testcontainers (Docker disponible nativement sur ubuntu-latest).
      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images (dev)
        run: docker compose build

      - name: Build Docker images (prod)
        run: |
          cp .env.prod.example .env.prod.ci
          sed -i 's/change-me-generate-with-openssl-rand-hex-32/ci-test-secret-not-for-production/g' .env.prod.ci
          docker compose --env-file .env.prod.ci -f docker-compose.prod.yml build

  docker-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build shop stack images
        run: |
          echo "POSTGRES_PASSWORD=ci-shop-pg" > .env.shop.ci
          echo "JWT_SECRET_SHOP=ci-shop-jwt-not-for-production" >> .env.shop.ci
          echo "SHOP_PANIER_SECRET=ci-shop-panier-not-for-production" >> .env.shop.ci
          docker compose --env-file .env.shop.ci -f docker-compose.shop.yml build api-shop gateway-shop

  shop-isolation-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test:e2e -- shop-isolation shop-paystack shop-checkout

  playwright-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caisse
          POSTGRES_PASSWORD: caisse
          POSTGRES_DB: caisse_crm
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U caisse -d caisse_crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://caisse:caisse@127.0.0.1:5433/caisse_crm?schema=public
      JWT_SECRET: ci-playwright-jwt-secret-not-for-production
      VITE_API_URL: http://localhost:3000
      # Passerelle mock (§6.6 diffusion de campagne) : permet de tester
      # POST /crm/campagnes/:id/envoyer sans dépendance externe réelle.
      SMS_GATEWAY_URL: mock://ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate and seed
        run: |
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api prisma:seed

      - name: Build API
        run: pnpm --filter api build

      - name: Start API
        run: pnpm --filter api start:prod &
        env:
          PORT: 3000
          NODE_ENV: test
          E2E_RELAX_AUTH_THROTTLE: '1'

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$code" = "200" ]; then
              echo "API ready (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "API did not start"
          exit 1

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Web E2E (POS, trésorerie, CRM, …)
        run: pnpm --filter web test:e2e

  # §6.7 « Sauvegarde et continuité » : vérifie que scripts/backup-postgres.sh
  # produit un dump restaurable par scripts/restore-postgres.sh, et que les
  # données restaurées sont identiques à l'original — pas seulement que les
  # scripts s'exécutent sans erreur.
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Démarrer la base (docker compose)
        run: docker compose up -d db

      - name: Attendre que la base soit prête
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U caisse -d caisse_crm; then
              exit 0
            fi
            sleep 2
          done
          echo "La base n'est pas devenue disponible à temps" >&2
          exit 1

      - name: Migrer et amorcer la base (données non vides à sauvegarder)
        run: |
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api prisma:seed
        env:
          DATABASE_URL: postgresql://caisse:caisse@127.0.0.1:5433/caisse_crm?schema=public

      - name: Sauvegarder (scripts/backup-postgres.sh)
        run: ./scripts/backup-postgres.sh

      - name: Restaurer vers une base de test distincte (scripts/restore-postgres.sh)
        run: |
          dump="$(ls -t backups/*.dump | head -1)"
          echo "RESTAURER" | ./scripts/restore-postgres.sh "$dump" --target-db caisse_crm_restore_ci

      - name: Vérifier que la base restaurée contient les mêmes données que l'originale
        run: |
          original=$(docker compose exec -T db psql -U caisse -d caisse_crm -t -A -c "SELECT count(*) FROM role;")
          restored=$(docker compose exec -T db psql -U caisse -d caisse_crm_restore_ci -t -A -c "SELECT count(*) FROM role;")
          echo "role : original=${original} restauré=${restored}"
          if [ "$original" != "$restored" ]; then
            echo "Divergence entre la base d'origine et la base restaurée — sauvegarde non fiable" >&2
            exit 1
          fi

  docker-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build staging stack images
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-staging-pg"
            echo "JWT_SECRET=ci-staging-jwt-not-for-production"
            echo "JWT_SECRET_SHOP=ci-staging-shop-jwt-not-for-production"
            echo "SHOP_PANIER_SECRET=ci-staging-panier-not-for-production"
          } > .env.staging.ci
          docker compose --env-file .env.staging.ci -f docker-compose.staging.yml build

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY == 'true'
    needs:
      - build-and-test
      - docker
      - docker-shop
      - docker-staging
      - shop-isolation-e2e
      - playwright-e2e
      - backup-restore
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Déployer staging sur le VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/apps/caisse-crm
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            chmod +x scripts/deploy-staging.sh
            ./scripts/deploy-staging.sh
